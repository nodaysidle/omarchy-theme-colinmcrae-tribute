# Colin McRae Tribute — Alacritty Terminal Configuration
# Tribute to Colin McRae MBE & Nicky Grist — 1997 Subaru Impreza WRC97 (P2 WRC)

[window]
opacity = 0.84

[colors.primary]
background = "#0B101D"
foreground = "#F2F5F8"

[colors.cursor]
text = "#0B101D"
cursor = "#FFF200"

[colors.vi_mode_cursor]
text = "#0B101D"
cursor = "#D4AF37"

[colors.search.matches]
foreground = "#0B101D"
background = "#FFF200"

[colors.search.focused_match]
foreground = "#F2F5F8"
background = "#FF0055"

[colors.footer_bar]
foreground = "#0B101D"
background = "#F2F5F8"

[colors.selection]
text = "#F4F6FB"
background = "#1B3B6F"

[colors.normal]
black = "#141820"
red = "#FF0055"
green = "#00E676"
yellow = "#FFF200"
blue = "#1255CC"
magenta = "#E040FB"
cyan = "#00D2FF"
white = "#D4AF37"

[colors.bright]
black = "#4C6B99"
red = "#FF3377"
green = "#69F0AE"
yellow = "#FFFF66"
blue = "#4D88FF"
magenta = "#EA80FC"
cyan = "#80E5FF"
white = "#FFFFFF"
